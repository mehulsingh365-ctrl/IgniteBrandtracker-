name: Refresh news

on:
  schedule:
    - cron: "47 */2 * * *"   # every 2 hours (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect news
        run: python ignite/scripts/update_news.py
      - name: Save changes
        if: always()
        run: |
          git config user.name "ignite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ignite/data/news.csv ignite/data/status/news.json
          git diff --cached --quiet && exit 0
          git commit -m "News refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
