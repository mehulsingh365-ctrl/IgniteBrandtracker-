name: Refresh YouTube data

on:
  schedule:
    - cron: "17 * * * *"   # every hour (UTC); GitHub may run it later than planned
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update YouTube stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python ignite/scripts/update_youtube.py
      - name: Save changes
        if: always()
        run: |
          git config user.name "ignite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ignite/data/posts/youtube.csv ignite/data/status/youtube.json
          git diff --cached --quiet && exit 0
          git commit -m "YouTube refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
