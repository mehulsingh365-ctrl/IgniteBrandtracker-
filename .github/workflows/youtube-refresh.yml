name: Refresh YouTube data

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC)
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update YouTube stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_youtube.py
      - name: Commit changes
        run: |
          git config user.name "brand-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/competitor_posts.csv
          git diff --cached --quiet || (git commit -m "YouTube refresh $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
