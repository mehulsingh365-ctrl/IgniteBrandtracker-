name: Daily brand interest and history

on:
  schedule:
    - cron: "23 4 * * *"   # once a day, early morning (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Brand interest and weekly history
        run: python ignite/scripts/update_daily.py
      - name: Save changes
        if: always()
        run: |
          git config user.name "ignite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ignite/data
          git diff --cached --quiet && exit 0
          git commit -m "Daily interest and history $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
