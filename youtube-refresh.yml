name: Refresh YouTube data

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC)
  workflow_dispatch: {}       # run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: data-updates          # one data update at a time, so engines never clash
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update YouTube stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_youtube.py
      - name: Save changes
        if: always()
        run: |
          git config user.name "ignite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts/youtube.csv data/status/youtube.json
          git diff --cached --quiet && exit 0
          git commit -m "YouTube refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
